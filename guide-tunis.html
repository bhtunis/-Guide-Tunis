<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Business Hotel Tunis — Guide de Tunis</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<style>

:root{
  --sand:#F3E8D8;
  --sand-deep:#E3D0BA;
  --paper:#FFF9F0;
  --ink:#33251F;
  --ink-soft:#66544A;

  --blue-deep:#4A2C20;
  --blue:#6B4030;
  --blue-pale:#EDE0D2;

  --clay:#A67C5B;
  --clay-deep:#6B4030;

  --line:rgba(74,44,32,0.16);
  --radius:14px;
  --shadow:0 8px 24px rgba(74,44,32,0.12);

  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Work Sans', -apple-system, 'Segoe UI', sans-serif;
}

:root[data-theme="dark"]{
  --sand:#3A2922;
  --sand-deep:#4A352B;
  --paper:#2B211D;
  --ink:#F5EDE4;
  --ink-soft:#CDBFB5;

  --blue-deep:#8B5A3C;
  --blue:#6B4030;
  --blue-pale:#46362D;

  --clay:#C58A68;
  --clay-deep:#D9A17F;

  --line:rgba(245,237,228,0.14);
  --shadow:0 8px 24px rgba(0,0,0,0.30);
}

/* ---------- LOGO TUNIS CAPITALE DU TOURISME ---------- */

.tourism-logo{
  display:block;
  width:150px;
  max-width:60%;
  height:auto;
  margin:0 auto 24px 0;
  border-radius:12px;
}

/* ---------- DARK MODE ---------- */

@media (prefers-color-scheme: dark){

  :root:not([data-theme="light"]){

    --sand:#3A2922;
    --sand-deep:#4A352B;
    --paper:#2B211D;
    --ink:#F5EDE4;
    --ink-soft:#CDBFB5;

    --blue-deep:#8B5A3C;
    --blue:#6B4030;
    --blue-pale:#46362D;

    --clay:#C58A68;
    --clay-deep:#D9A17F;

    --line:rgba(245,237,228,0.14);
    --shadow:0 8px 24px rgba(0,0,0,0.30);

  }

}

/* ---------- GENERAL ---------- */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  background:var(--sand);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

html[dir="rtl"] body{
  font-family:'Tajawal',var(--font-body);
}

h1,
h2,
h3,
.display{
  font-family:var(--font-display);
  font-weight:600;
  letter-spacing:-0.01em;
}

html[dir="rtl"] h1,
html[dir="rtl"] h2,
html[dir="rtl"] h3,
html[dir="rtl"] .display{
  font-family:'Aref Ruqaa','Tajawal',serif;
  font-weight:700;
  letter-spacing:0;
}

a{
  color:inherit;
}

button{
  font-family:inherit;
}

/* ---------- TOP BAR ---------- */

.topbar{
  position:sticky;
  top:0;
  z-index:40;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;
  padding:10px 16px;

  background:var(--paper);
  border-bottom:1px solid var(--line);
}

.topbar .brand{
  font-family:var(--font-display);
  font-size:0.95rem;
  font-weight:700;
  color:var(--blue-deep);
  white-space:nowrap;
}

html[dir="rtl"] .topbar .brand{
  font-family:'Aref Ruqaa',serif;
  font-size:1.05rem;
}

.langswitch{
  display:flex;
  gap:4px;
  background:var(--sand);
  border-radius:999px;
  padding:3px;
}

.langswitch button{
  border:none;
  background:transparent;

  padding:6px 10px;
  border-radius:999px;

  font-size:0.78rem;
  font-weight:600;

  color:var(--ink-soft);
  cursor:pointer;
}

.langswitch button[aria-pressed="true"]{
  background:var(--blue-deep);
  color:var(--paper);
}

/* ---------- HERO ---------- */

.hero{
  position:relative;

  background:linear-gradient(
    180deg,
    #4A2C20 0%,
    #6B4030 100%
  );

  color:#f4efe1;

  padding:38px 20px 64px;

  overflow:hidden;
}

.hero .eyebrow{
  font-size:0.78rem;
  letter-spacing:0.04em;
  color:#D9B89C;
  margin:0 0 10px;
}

.hero h1{
  font-size:2.35rem;
  line-height:1.05;
  margin:0 0 10px;
  color:#fbf7ec;
}

html[dir="rtl"] .hero h1{
  font-size:2.1rem;
  line-height:1.3;
}

.hero p{
  max-width:34ch;
  font-size:0.98rem;
  color:#E8D8CB;
  margin:0;
}

.hero .arches{
  position:absolute;
  left:0;
  right:0;
  bottom:-2px;

  width:100%;
  height:46px;
}

.hero .arches path{
  fill:var(--sand);
}

/* ---------- QUICK NAV ---------- */

.quicknav{
  display:flex;
  gap:8px;

  overflow-x:auto;

  padding:14px 16px 4px;

  scrollbar-width:none;
}

.quicknav::-webkit-scrollbar{
  display:none;
}

.quicknav a{
  flex:0 0 auto;

  text-decoration:none;

  font-size:0.82rem;
  font-weight:600;

  color:var(--blue-deep);

  background:var(--paper);

  border:1px solid var(--line);

  padding:8px 14px;

  border-radius:999px;

  white-space:nowrap;
}

/* ---------- SECTIONS ---------- */

main{
  padding:6px 16px 40px;
  max-width:640px;
  margin:0 auto;
}

.card-photo{
  width:100%;
  height:190px;

  object-fit:cover;

  display:block;

  border-radius:12px;

  margin-bottom:16px;
}

details.card{
  background:var(--paper);

  border:1px solid var(--line);

  border-radius:var(--radius);

  margin:14px 0;

  box-shadow:var(--shadow);

  overflow:hidden;
}

details.card > summary{
  list-style:none;
  cursor:pointer;

  padding:16px 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;
}

details.card > summary::-webkit-details-marker{
  display:none;
}

.summary-text .tag{
  display:inline-block;

  font-size:0.72rem;
  font-weight:600;

  color:var(--clay-deep);

  background:color-mix(
    in srgb,
    var(--clay) 14%,
    var(--paper)
  );

  padding:3px 9px;

  border-radius:999px;

  margin-bottom:6px;
}

.summary-text h2{
  font-size:1.18rem;
  margin:0;
  color:var(--ink);
}

.chev{
  flex:0 0 auto;

  width:26px;
  height:26px;

  border-radius:50%;

  border:1px solid var(--line);

  display:flex;
  align-items:center;
  justify-content:center;

  transition:transform .25s ease;

  color:var(--blue-deep);
}

details[open] .chev{
  transform:rotate(180deg);
}

.card-body{
  padding:0 18px 18px;
}

.lead{
  font-style:italic;

  color:var(--ink-soft);

  font-size:0.94rem;

  margin:0 0 14px;
}

ul.highlights{
  list-style:none;

  margin:0 0 14px;
  padding:0;

  display:flex;
  flex-direction:column;

  gap:10px;
}

ul.highlights li{
  display:flex;
  align-items:flex-start;

  gap:10px;

  font-size:0.93rem;

  padding:10px 12px;

  background:var(--sand);

  border-radius:10px;
}

ul.highlights li .dot{
  flex:0 0 auto;

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--clay);

  margin-top:7px;
}

ul.highlights li .htext{
  flex:1 1 auto;
}

ul.highlights li .htext strong{
  color:var(--blue-deep);
}

.pin{
  flex:0 0 auto;

  display:inline-flex;
  align-items:center;

  gap:4px;

  text-decoration:none;

  font-size:0.74rem;
  font-weight:600;

  color:var(--blue);

  border:1px solid var(--line);

  padding:5px 9px;

  border-radius:999px;

  white-space:nowrap;

  margin-top:1px;
}

.pin svg{
  width:12px;
  height:12px;
}

.foot-row{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  flex-wrap:wrap;

  border-top:1px dashed var(--line);

  padding-top:12px;
}

.distance{
  font-size:0.82rem;
  color:var(--ink-soft);
}

.distance b{
  color:var(--ink);
  font-weight:600;
}

.btn-map{
  display:inline-flex;

  align-items:center;

  gap:6px;

  text-decoration:none;

  font-weight:700;

  font-size:0.85rem;

  color:#fff;

  background:var(--clay);

  padding:9px 16px;

  border-radius:999px;

  box-shadow:0 4px 12px rgba(184,85,44,0.3);
}

.btn-map svg{
  width:14px;
  height:14px;
}

/* ---------- SEASONS ---------- */

.season-grid{
  display:grid;

  grid-template-columns:1fr;

  gap:12px;

  margin-bottom:14px;
}

.season{
  background:var(--sand);

  border-radius:10px;

  padding:14px;
}

.season h3{
  font-size:0.98rem;

  margin:0 0 4px;

  color:var(--blue-deep);
}

.season .when{
  font-size:0.76rem;

  color:var(--ink-soft);

  margin:0 0 10px;
}

.season ul{
  margin:0;
  padding:0;

  list-style:none;

  display:flex;
  flex-direction:column;

  gap:8px;
}

.season li{
  font-size:0.88rem;

  display:flex;

  gap:8px;
}

.season li .dot{
  flex:0 0 auto;

  width:6px;
  height:6px;

  margin-top:7px;

  border-radius:50%;

  background:var(--blue);
}

.callout{
  background:var(--blue-pale);

  border-radius:10px;

  padding:12px 14px;

  font-size:0.86rem;

  color:var(--ink);
}

.callout b{
  color:var(--blue-deep);
}

/* ---------- AROUND TUNIS ---------- */

.dest-list{
  display:flex;
  flex-direction:column;

  gap:10px;

  margin-bottom:14px;
}

.dest{
  display:flex;

  align-items:center;

  gap:12px;

  background:var(--sand);

  border-radius:10px;

  padding:12px;
}

.dest .info{
  flex:1 1 auto;
}

.dest .info .name{
  font-weight:700;

  font-size:0.92rem;

  color:var(--ink);
}

.dest .info .desc{
  font-size:0.82rem;

  color:var(--ink-soft);

  margin-top:2px;
}

.dest .time{
  flex:0 0 auto;

  font-size:0.72rem;

  font-weight:700;

  color:var(--clay-deep);

  background:color-mix(
    in srgb,
    var(--clay) 14%,
    var(--paper)
  );

  padding:3px 8px;

  border-radius:999px;
}

.note-box{
  border:1px solid var(--line);

  border-radius:10px;

  padding:14px;

  margin-bottom:12px;
}

.note-box .lbl{
  font-size:0.72rem;

  font-weight:700;

  color:var(--clay-deep);

  margin-bottom:4px;
}

.note-box p{
  margin:4px 0 0;

  font-size:0.86rem;

  color:var(--ink-soft);
}

.hotel-box{
  display:flex;

  gap:12px;

  align-items:center;

  background:var(--blue-pale);

  border-radius:10px;

  padding:14px;
}

.hotel-box .h-icon{
  flex:0 0 auto;

  width:34px;
  height:34px;
}

.hotel-box .h-text b{
  display:block;

  font-size:0.88rem;

  color:var(--blue-deep);
}

.hotel-box .h-text p{
  margin:2px 0 0;

  font-size:0.82rem;

  color:var(--ink-soft);
}

/* ---------- PRACTICAL ---------- */

.practical-cols{
  display:grid;

  grid-template-columns:1fr;

  gap:16px;

  margin-bottom:16px;
}

.col h3{
  font-size:0.9rem;

  margin:0 0 10px;

  color:var(--blue-deep);
}

.col ul{
  list-style:none;

  margin:0;
  padding:0;

  display:flex;

  flex-direction:column;

  gap:8px;
}

.col li{
  font-size:0.87rem;

  display:flex;

  gap:8px;

  border-inline-start:2px solid var(--line);

  padding-inline-start:9px;
}

/* ---------- CONTACT ---------- */

.contact-card{
  background:var(--blue-deep);

  color:#f4efe1;

  border-radius:var(--radius);

  padding:20px;

  margin-top:6px;
}

.contact-card p.thanks{
  font-style:italic;

  font-size:0.9rem;

  color:#E8D8CB;

  margin:0 0 16px;
}

.contact-line{
  display:flex;

  align-items:center;

  gap:10px;

  text-decoration:none;

  color:#f4efe1;

  padding:9px 0;

  border-top:1px solid rgba(244,239,225,0.14);

  font-size:0.88rem;
}

.contact-line:first-of-type{
  border-top:none;
}

.contact-line svg{
  flex:0 0 auto;

  width:17px;
  height:17px;

  opacity:0.85;
}

.contact-map{
  margin-top:14px;

  display:inline-flex;

  align-items:center;

  gap:8px;

  background:var(--clay);

  color:#fff;

  text-decoration:none;

  font-weight:700;

  font-size:0.85rem;

  padding:10px 18px;

  border-radius:999px;
}

/* ---------- FOOTER ---------- */

footer{
  text-align:center;

  padding:20px;

  font-size:0.74rem;

  color:var(--ink-soft);
}

/* ---------- TOC ---------- */

.toc-title{
  font-size:0.78rem;

  font-weight:700;

  letter-spacing:0.02em;

  color:var(--ink-soft);

  padding:14px 16px 0;
}

/* ---------- RESPONSIVE ---------- */

@media (min-width:560px){

  .season-grid{
    grid-template-columns:1fr 1fr;
  }

  .practical-cols{
    grid-template-columns:1fr 1fr;
  }

}

</style>
</head>

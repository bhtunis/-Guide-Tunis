  /* ---------- quick nav ---------- */
  .quicknav{
    display:flex; gap:8px; overflow-x:auto; padding:14px 16px 4px;
    scrollbar-width:none;
  }
  .quicknav::-webkit-scrollbar{ display:none; }
  .quicknav a{
    flex:0 0 auto; text-decoration:none; font-size:0.82rem; font-weight:600;
    color:var(--blue-deep); background:var(--paper); border:1px solid var(--line);
    padding:8px 14px; border-radius:999px; white-space:nowrap;

  /* ---------- sections ---------- */
  main{ padding:6px 16px 40px; max-width:640px; margin:0 auto; }
  details.card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    margin:14px 0; box-shadow:var(--shadow); overflow:hidden;
  }
  details.card > summary{
    list-style:none; cursor:pointer; padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  details.card > summary::-webkit-details-marker{ display:none; }
  .summary-text .tag{
    display:inline-block; font-size:0.72rem; font-weight:600; color:var(--clay-deep);
    background:color-mix(in srgb, var(--clay) 14%, var(--paper)); padding:3px 9px; border-radius:999px; margin-bottom:6px;
  }
  .summary-text h2{ font-size:1.18rem; margin:0; color:var(--ink); }
  .chev{ flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; transition:transform .25s ease; color:var(--blue-deep); }
  details[open] .chev{ transform:rotate(180deg); }
  .card-body{ padding:0 18px 18px; }
  .lead{ font-style:italic; color:var(--ink-soft); font-size:0.94rem; margin:0 0 14px; }
  ul.highlights{ list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:10px; }
  ul.highlights li{
    display:flex; align-items:flex-start; gap:10px; font-size:0.93rem; padding:10px 12px;
    background:var(--sand); border-radius:10px;
  }
  ul.highlights li .dot{ flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:var(--clay); margin-top:7px; }
  ul.highlights li .htext{ flex:1 1 auto; }
  ul.highlights li .htext strong{ color:var(--blue-deep); }
  .pin{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:4px; text-decoration:none;
    font-size:0.74rem; font-weight:600; color:var(--blue); border:1px solid var(--line);
    padding:5px 9px; border-radius:999px; white-space:nowrap; margin-top:1px;
  }
  .pin svg{ width:12px; height:12px; }
  .foot-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    border-top:1px dashed var(--line); padding-top:12px; }
  .distance{ font-size:0.82rem; color:var(--ink-soft); }
  .distance b{ color:var(--ink); font-weight:600; }
  .btn-map{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none; font-weight:700;

  /* seasons */
  .season-grid{ display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:14px; }
  .season{ background:var(--sand); border-radius:10px; padding:14px; }
  .season h3{ font-size:0.98rem; margin:0 0 4px; color:var(--blue-deep); }
  .season .when{ font-size:0.76rem; color:var(--ink-soft); margin:0 0 10px; }
  .season ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
  .season li{ font-size:0.88rem; display:flex; gap:8px; }
  .season li .dot{ flex:0 0 auto; width:6px; height:6px; margin-top:7px; border-radius:50%; background:var(--blue); }
  .callout{ background:var(--blue-pale); border-radius:10px; padding:12px 14px; font-size:0.86rem; color:var(--ink); }
  .callout b{ color:var(--blue-deep); }

  /* around tunis list */
  .dest-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .dest{ display:flex; align-items:center; gap:12px; background:var(--sand); border-radius:10px; padding:12px; }
  .dest .info{ flex:1 1 auto; }
  .dest .info .name{ font-weight:700; font-size:0.92rem; color:var(--ink); }
  .dest .info .desc{ font-size:0.82rem; color:var(--ink-soft); margin-top:2px; }
  .dest .time{ flex:0 0 auto; font-size:0.72rem; font-weight:700; color:var(--clay-deep);
    background:color-mix(in srgb, var(--clay) 14%, var(--paper)); padding:3px 8px; border-radius:999px; }
  .note-box{ border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .note-box .lbl{ font-size:0.72rem; font-weight:700; color:var(--clay-deep); margin-bottom:4px; }
  .note-box p{ margin:4px 0 0; font-size:0.86rem; color:var(--ink-soft); }
  .hotel-box{ display:flex; gap:12px; align-items:center; background:var(--blue-pale); border-radius:10px; padding:14px; }
  .hotel-box .h-icon{ flex:0 0 auto; width:34px; height:34px; }
  .hotel-box .h-text b{ display:block; font-size:0.88rem; color:var(--blue-deep); }
  .hotel-box .h-text p{ margin:2px 0 0; font-size:0.82rem; color:var(--ink-soft); }

  /* practical */
  .practical-cols{ display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:16px; }
  .col h3{ font-size:0.9rem; margin:0 0 10px; color:var(--blue-deep); }
  .col ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .col li{ font-size:0.87rem; display:flex; gap:8px; border-inline-start:2px solid var(--line); padding-inline-start:9px; }

  .contact-card{ background:var(--blue-deep); color:#f4efe1; border-radius:var(--radius); padding:20px; margin-top:6px; }
  .contact-card p.thanks{ font-style:italic; font-size:0.9rem; color:#dbe6ea; margin:0 0 16px; }
  .contact-line{ display:flex; align-items:center; gap:10px; text-decoration:none; color:#f4efe1;

  .contact-line:first-of-type{ border-top:none; }
  .contact-line svg{ flex:0 0 auto; width:17px; height:17px; opacity:0.85; }
  .contact-map{ margin-top:14px; display:inline-flex; align-items:center; gap:8px; background:var(--clay);
    color:#fff; text-decoration:none; font-weight:700; font-size:0.85rem; padding:10px 18px; border-radius:999px; }

  footer{ text-align:center; padding:20px; font-size:0.74rem; color:var(--ink-soft); }

  /* toc heading */
  .toc-title{ font-size:0.78rem; font-weight:700; letter-spacing:0.02em; color:var(--ink-soft); padding:14px 16px 0; }

html {

  width: 100%;

  padding: 6px 16px 40px;
}

/* Hero responsive */
.hero {
  width: 100%;
  min-height: 480px;
  padding: 28px 16px 60px;
}

  width: 100%;
  display: flex;

  width: 60px;
  max-width: 18vw;
}

  width: 90px;
  max-width: 25vw;
}

/* Texte du hero */

  font-size: clamp(2rem, 8vw, 3rem);
  line-height: 1.1;
  max-width: 100%;
}

.hero p {
  max-width: 100%;
  font-size: clamp(1rem, 4vw, 1.25rem);
  line-height: 1.5;
}

/* Navigation horizontale */
.quicknav {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* Cartes */
details.card {
  width: 100%;
  max-width: 100%;
}

.card-body {
  width: 100%;

  var current = 'fr';
  try{ var saved = window.localStorage.getItem('guideLang'); if(saved && DATA[saved]) current = saved; }catch(e){}

  function el(tag, attrs, html){
    var e = document.createElement(tag);
    if(attrs) for(var k in attrs) e.setAttribute(k, attrs[k]);
    if(html!=null) e.innerHTML = html;
    return e;
  }

  function renderHighlightItem(it){
    var li = document.createElement('li');
    var dot = el('span',{class:'dot'});
    var txt = el('span',{class:'htext'}, it.t);
    li.appendChild(dot); li.appendChild(txt);
    if(it.loc && LOC[it.loc]){
      var a = el('a',{class:'pin', href:mapsUrl(LOC[it.loc]), target:'_blank', rel:'noopener'});
      a.innerHTML = ICONS.pin + '<span>' + D.ui.viewMap + '</span>';
      li.appendChild(a);
    }
    return li;
  }

  var D;

  function renderSection(s){
    var card = el('details',{class:'card', id:s.id});
    var summary = el('summary');
    var stext = el('div',{class:'summary-text'});
    stext.innerHTML = '<span class="tag">'+s.tag+'</span><h2>'+s.title+'</h2>';
    var chev = el('span',{class:'chev'}); chev.innerHTML = ICONS.chev;
    summary.appendChild(stext); summary.appendChild(chev);
    card.appendChild(summary);

    var body = el('div',{class:'card-body'});
    body.appendChild(el('p',{class:'lead'}, s.lead));

    if(s.special === 'seasons'){
      var grid = el('div',{class:'season-grid'});
      [s.summer, s.winter].forEach(function(grp){
        var box = el('div',{class:'season'});
        box.innerHTML = '<h3>'+grp.label+'</h3><p class="when">'+grp.when+'</p>';
        var ul = el('ul');
        grp.items.forEach(function(txt){
          var li = document.createElement('li');
          li.innerHTML = '<span class="dot"></span><span>'+txt+'</span>';
          ul.appendChild(li);
        });
        box.appendChild(ul);
        grid.appendChild(box);
      });
      body.appendChild(grid);
      body.appendChild(el('div',{class:'callout'}, '<b>'+D.ui.goodToKnow+'.</b> '+s.good));
    } else if(s.special === 'around'){
      var list = el('div',{class:'dest-list'});
      s.dests.forEach(function(d){
        var row = el('div',{class:'dest'});
        var info = el('div',{class:'info'});
        info.innerHTML = '<div class="name">'+d.name+'</div><div class="desc">'+d.desc+'</div>';
        row.appendChild(info);
        row.appendChild(el('span',{class:'time'}, d.time));
        if(d.loc && LOC[d.loc]){
          var a = el('a',{class:'pin', href:mapsUrl(LOC[d.loc]), target:'_blank', rel:'noopener'});
          a.innerHTML = ICONS.pin;
          row.appendChild(a);
        }
        list.appendChild(row);
      });
      body.appendChild(list);
      var note = el('div',{class:'note-box'});
      note.innerHTML = '<div class="lbl">'+s.transferLbl+'</div><p>'+s.transferText+'</p>';
      body.appendChild(note);
      var hbox = el('div',{class:'hotel-box sfax-hotel'});

hbox.innerHTML = `
  <img 
    src="${s.hotelBox.image}" 
    alt="${s.hotelBox.title}"
    class="sfax-hotel-image"
  >

  <div class="sfax-hotel-content">

    <div class="sfax-hotel-label">
      BUSINESS HOTELS
    </div>

    <h3>${s.hotelBox.title}</h3>

    <p>${s.hotelBox.text}</p>

    <div class="sfax-hotel-address">
      📍 ${s.hotelBox.address}
    </div>

    <a 
      href="${s.hotelBox.maps}"
      target="_blank"
      rel="noopener"
      class="sfax-hotel-map"
    >
      📍 Voir sur Google Maps
    </a>

  </div>
`;

body.appendChild(hbox);
    } else if(s.special === 'practical'){
      var cols = el('div',{class:'practical-cols'});
      var c1 = el('div',{class:'col'});
      c1.innerHTML = '<h3>'+D.ui.getAround+'</h3>';
      var u1 = el('ul');
      s.getAround.forEach(function(t){ u1.appendChild(el('li',null,t)); });
      c1.appendChild(u1);
      var c2 = el('div',{class:'col'});
      c2.innerHTML = '<h3>'+D.ui.goodToKnow+'</h3>';
      var u2 = el('ul');
      s.goodToKnow.forEach(function(t){ u2.appendChild(el('li',null,t)); });
      c2.appendChild(u2);
      cols.appendChild(c1); cols.appendChild(c2);
      body.appendChild(cols);

      var contact = el('div',{class:'contact-card'});
      var inner = '<p class="thanks">'+s.thanks+'</p>';
      inner += '<div class="contact-line">'+ICONS.clock+'<span>'+D.ui.reception+'</span></div>';
      inner += '<div class="contact-line">'+ICONS.home+'<span>'+s.address+'</span></div>';
      inner += '<a class="contact-line" href="tel:'+s.phone.replace(/[^\d+]/g,'')+'">'+ICONS.phone+'<span>'+s.phone+'</span></a>';
      inner += '<a class="contact-line" href="mailto:'+s.email1+'">'+ICONS.mail+'<span>'+s.email1+'</span></a>';
      inner += '<a class="contact-line" href="mailto:'+s.email2+'">'+ICONS.mail+'<span>'+s.email2+'</span></a>';
      contact.innerHTML = inner;
      var mapLink = el('a',{class:'contact-map', href:mapsUrl(LOC.hotel), target:'_blank', rel:'noopener'});
      mapLink.innerHTML = ICONS.pin + '<span>' + D.ui.locateHotel + '</span>';
      contact.appendChild(mapLink);
      body.appendChild(contact);
    } else {
      var ul = el('ul',{class:'highlights'});
      s.items.forEach(function(it){ ul.appendChild(renderHighlightItem(it)); });
      body.appendChild(ul);
      var foot = el('div',{class:'foot-row'});
      foot.appendChild(el('span',{class:'distance'}, '<b>'+D.ui.distance+'</b> · '+s.distance));
      if(s.loc && LOC[s.loc]){
        var cta = el('a',{class:'btn-map', href:mapsUrl(LOC[s.loc]), target:'_blank', rel:'noopener'});
        cta.innerHTML = ICONS.pin + '<span>' + D.ui.directions + '</span>';
        foot.appendChild(cta);
      }
      body.appendChild(foot);
    }

    card.appendChild(body);
    return card;
  }

  function render(lang){
    D = DATA[lang];
    document.documentElement.setAttribute('lang', lang === 'ar' ? 'ar' : lang);
    document.documentElement.setAttribute('dir', D.dir);
    document.getElementById('brandLabel').textContent = D.brand;
    document.getElementById('heroEyebrow').textContent = D.hero.eyebrow;
    document.getElementById('heroTitle').textContent = D.hero.title;
    document.getElementById('heroSubtitle').textContent = D.hero.subtitle;
    document.getElementById('footerText').textContent = D.ui.footer;

    var nav = document.getElementById('quickNav');
    nav.innerHTML = '';
    var tocLbl = document.getElementById('tocLabel');

    var main = document.getElementById('mainContent');
    main.innerHTML = '';
    D.sections.forEach(function(s, idx){
      var a = el('a',{href:'#'+s.id}, s.title);
      a.addEventListener('click', function(ev){
        ev.preventDefault();
        var target = document.getElementById(s.id);
        target.open = true;
        target.scrollIntoView({behavior:'smooth', block:'start'});
      });
      nav.appendChild(a);
      var card = renderSection(s);
      if(idx === 0) card.open = true;
      main.appendChild(card);
    });

    document.querySelectorAll('.langswitch button').forEach(function(btn){
      btn.setAttribute('aria-pressed', btn.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
  }

  document.querySelectorAll('.langswitch button').forEach(function(btn){
    btn.addEventListener('click', function(){
      var lang = btn.getAttribute('data-lang');
      current = lang;
      try{ window.localStorage.setItem('guideLang', lang); }catch(e){}
      render(lang);
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });

  render(current);
})();
</script>
